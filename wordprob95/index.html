<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDPROB95.EXE</title><style>*{box-sizing:border-box}body{margin:0;background:#008080;font:15px 'Trebuchet MS',Arial,sans-serif;color:#111;padding:10px}.window{max-width:680px;margin:auto;background:silver;border:3px solid;border-color:#fff #444 #444 #fff;box-shadow:2px 2px #111}.bar{background:linear-gradient(90deg,navy,#1685a6);color:white;padding:7px;font-weight:bold;display:flex;justify-content:space-between}.inner{padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}select,button,input{font:inherit}button,select{background:#ddd;border:2px solid;border-color:#fff #555 #555 #fff;padding:6px 10px;cursor:pointer}button:active{border-color:#555 #fff #fff #555}button:focus-visible{outline:3px solid #ff0}.screen{background:#071b0e;color:#a4ffaf;border:3px inset #aaa;padding:16px;line-height:1.5;min-height:155px}.prompt{font-size:1.12rem;font-weight:bold}.muted{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.panel{background:#e8e8e8;border:2px inset #aaa;padding:12px;margin-top:8px;line-height:1.5}.hide{display:none}.equation{width:100%;max-width:350px;padding:7px;border:2px inset #aaa}.status{border-top:1px solid #888;padding:8px;font-size:12px}.correct{color:#075b16;font-weight:bold}.error{color:#900;font-weight:bold}@media(max-width:450px){body{padding:4px}.inner{padding:8px}.screen{padding:10px}.prompt{font-size:1rem}}</style></head><body><main class="window"><header class="bar"><span>▦ WORDPROB95.EXE — MULTI-STEP MATH</span><span>□ ×</span></header><section class="inner"><div class="toolbar"><label for="level">LEVEL:</label><select id="level"><option value="mixed">Mixed</option><option value="two">Two-step</option><option value="challenge">Challenge (3 steps)</option></select><button id="daily">Today's problem</button><button id="next">Next ▶</button></div><div class="screen" aria-live="polite"><div class="muted" id="heading"></div><p class="prompt" id="problem"></p><div id="question"></div></div><div class="actions"><button id="hint1">Hint 1</button><button id="hint2">Hint 2</button><button id="reveal">Show solution</button><button id="reset">Hide help</button></div><div class="panel hide" id="help" aria-live="polite"></div><div class="panel"><label for="answer"><b>Final answer:</b></label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input class="equation" id="answer" type="number" inputmode="numeric" placeholder="Enter a number"><button id="check">Check ✓</button></div><div id="feedback" aria-live="polite" style="margin-top:7px"></div><p class="muted">Solve on paper first. Write an equation for every step and label your answer.</p></div></section><footer class="status" id="status">READY • Offline friendly • No sign-in</footer></main><script>
const problems=[
{level:'two',story:'The library has 7 shelves with 8 books on each shelf. Students borrow 19 books.',q:'How many books are left?',answer:37,unit:'books',h1:'Find the total number of books first.',h2:'Multiply 7 × 8, then subtract 19.',steps:['7 × 8 = 56 books','56 − 19 = 37 books']},
{level:'two',story:'There are 45 stickers. A teacher gives 9 stickers to each of 3 groups.',q:'How many stickers remain?',answer:18,unit:'stickers',h1:'Find how many stickers were given away.',h2:'Multiply 9 × 3, then subtract from 45.',steps:['9 × 3 = 27 stickers given away','45 − 27 = 18 stickers']},
{level:'two',story:'A class collects 36 cans on Monday and 28 cans on Tuesday. They pack the cans equally into 8 bags.',q:'How many cans go in each bag?',answer:8,unit:'cans per bag',h1:'Combine the cans from both days.',h2:'Add 36 + 28, then divide by 8.',steps:['36 + 28 = 64 cans','64 ÷ 8 = 8 cans per bag']},
{level:'two',story:'A bakery makes 9 trays of 6 muffins each. It sells 38 muffins.',q:'How many muffins are unsold?',answer:16,unit:'muffins',h1:'How many muffins were baked?',h2:'Multiply 9 × 6, then subtract 38.',steps:['9 × 6 = 54 muffins','54 − 38 = 16 muffins']},
{level:'two',story:'A garden has 6 rows of 7 carrots. Students plant 15 more carrots.',q:'How many carrots are there now?',answer:57,unit:'carrots',h1:'Find the number of carrots in the rows.',h2:'Multiply 6 × 7, then add 15.',steps:['6 × 7 = 42 carrots','42 + 15 = 57 carrots']},
{level:'two',story:'A school has 80 pencils. It puts 6 pencils into each of 9 supply cups.',q:'How many pencils are not in cups?',answer:26,unit:'pencils',h1:'Find how many pencils are placed in cups.',h2:'Multiply 6 × 9, then subtract from 80.',steps:['6 × 9 = 54 pencils in cups','80 − 54 = 26 pencils']},
{level:'two',story:'There are 24 red balloons and 18 blue balloons. They are divided equally among 6 tables.',q:'How many balloons does each table get?',answer:7,unit:'balloons per table',h1:'Find the total number of balloons.',h2:'Add 24 + 18, then divide by 6.',steps:['24 + 18 = 42 balloons','42 ÷ 6 = 7 balloons per table']},
{level:'two',story:'A museum charges $7 per child. Four children attend, and their group has a $40 budget.',q:'How many dollars remain?',answer:12,unit:'dollars',h1:'Find the total cost of admission.',h2:'Multiply 4 × 7, then subtract from 40.',steps:['4 × 7 = 28 dollars','40 − 28 = 12 dollars']},
{level:'two',story:'A farmer picks 63 apples and gives 27 to a food pantry. The rest are packed equally into 6 baskets.',q:'How many apples go in each basket?',answer:6,unit:'apples per basket',h1:'Find how many apples remain.',h2:'Subtract 63 − 27, then divide by 6.',steps:['63 − 27 = 36 apples','36 ÷ 6 = 6 apples per basket']},
{level:'two',story:'A teacher buys 5 packs of 10 markers. Twelve markers dry out.',q:'How many usable markers remain?',answer:38,unit:'markers',h1:'Find the number of markers purchased.',h2:'Multiply 5 × 10, then subtract 12.',steps:['5 × 10 = 50 markers','50 − 12 = 38 markers']},
{level:'challenge',story:'A school orders 8 boxes of 9 crayons. It gives 18 crayons to one class and 22 to another.',q:'How many crayons are left?',answer:32,unit:'crayons',h1:'Find the total number of crayons.',h2:'Multiply 8 × 9, then subtract both amounts given away.',steps:['8 × 9 = 72 crayons','72 − 18 = 54 crayons','54 − 22 = 32 crayons']},
{level:'challenge',story:'A field trip has 54 students. Six students stay home. The rest ride equally in 4 vans.',q:'How many students ride in each van?',answer:12,unit:'students per van',h1:'Find how many students go on the trip.',h2:'Subtract 54 − 6, then divide by 4.',steps:['54 − 6 = 48 students','48 ÷ 4 = 12 students per van','Check: 12 × 4 = 48 students']},
{level:'challenge',story:'A class earns 35 points on Monday, 28 on Tuesday, and 17 on Wednesday. They spend 45 points on a reward.',q:'How many points do they have left?',answer:35,unit:'points',h1:'Add all three days of points.',h2:'Add 35 + 28 + 17, then subtract 45.',steps:['35 + 28 = 63 points','63 + 17 = 80 points','80 − 45 = 35 points']},
{level:'challenge',story:'A shop has 100 erasers. It sells 7 packs of 8 erasers, then receives 15 new erasers.',q:'How many erasers does it have now?',answer:59,unit:'erasers',h1:'Find how many erasers were sold.',h2:'Multiply 7 × 8, subtract from 100, then add 15.',steps:['7 × 8 = 56 erasers sold','100 − 56 = 44 erasers','44 + 15 = 59 erasers']},
{level:'challenge',story:'A teacher has 6 bags with 8 counters in each bag. She finds 12 more counters and divides all of them equally among 5 groups.',q:'How many counters does each group get?',answer:12,unit:'counters per group',h1:'Count the counters in the bags first.',h2:'Multiply 6 × 8, add 12, then divide by 5.',steps:['6 × 8 = 48 counters','48 + 12 = 60 counters','60 ÷ 5 = 12 counters per group']},
{level:'challenge',story:'A school garden grows 9 rows of 6 flowers. Ten flowers wilt, and students plant 18 new flowers.',q:'How many flowers are growing now?',answer:62,unit:'flowers',h1:'Find the starting number of flowers.',h2:'Multiply 9 × 6, subtract 10, then add 18.',steps:['9 × 6 = 54 flowers','54 − 10 = 44 flowers','44 + 18 = 62 flowers']}
];
const $=id=>document.getElementById(id);let current=0;let pool=[];let position=0;const dayNumber=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)};function selected(){const level=$('level').value;return problems.map((p,i)=>i).filter(i=>level==='mixed'||problems[i].level===level)}function render(){const p=problems[current];$('heading').textContent=`C:\\MATH95> ${p.level==='two'?'TWO-STEP':'CHALLENGE'} • PROBLEM ${current+1}/${problems.length}`;$('problem').textContent=p.story;$('question').textContent=p.q;$('help').classList.add('hide');$('help').textContent='';$('answer').value='';$('feedback').textContent='';$('status').textContent='READY • Work it out on paper • No student data collected'}function daily(){pool=selected();position=(dayNumber()%pool.length+pool.length)%pool.length;current=pool[position];render()}function next(){pool=selected();position=(position+1)%pool.length;current=pool[position];render()}function show(kind){const p=problems[current],el=$('help');el.classList.remove('hide');el.textContent=kind==='hint1'?'HINT 1: '+p.h1:kind==='hint2'?'HINT 2: '+p.h2:'SOLUTION:\n'+p.steps.join('\n')+'\nANSWER: '+p.answer+' '+p.unit;el.style.whiteSpace='pre-line'}$('level').addEventListener('change',daily);$('daily').onclick=daily;$('next').onclick=next;$('hint1').onclick=()=>show('hint1');$('hint2').onclick=()=>show('hint2');$('reveal').onclick=()=>show('reveal');$('reset').onclick=render;$('check').onclick=()=>{const v=$('answer').value.trim(),f=$('feedback');if(!v){f.textContent='Enter a number first.';f.className='error';return}const good=Number(v)===problems[current].answer;f.textContent=good?'✓ Correct! Remember to label your answer: '+problems[current].unit:'Not quite. Check each step or try a hint.';f.className=good?'correct':'error'};daily();
</script></body></html>
